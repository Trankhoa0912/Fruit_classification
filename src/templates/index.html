<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Phân Loại Trái Cây</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold mb-2 text-center text-slate-800">Phân Loại Trái Cây 🍎🍌🍊</h1>
        <p class="text-sm text-slate-500 text-center mb-6">Nhóm xử lý ảnh - Tải ảnh lên để phân tích</p>

        <!-- Form Upload -->
        <form id="uploadForm" class="space-y-4">
            <div class="border-2 border-dashed border-blue-300 p-4 rounded-lg bg-blue-50 text-center">
                <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-full file:border-0
                    file:text-sm file:font-semibold
                    file:bg-blue-600 file:text-white
                    hover:file:bg-blue-700 cursor-pointer" required>
            </div>

            <!-- Preview -->
            <div id="previewContainer" class="hidden flex justify-center mt-4">
                <img id="previewImage" src="" alt="Ảnh xem trước" class="max-h-48 rounded shadow-md object-cover border border-slate-200">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                🔍 Quét & Phân Tích
            </button>
        </form>

        <!-- Result -->
        <div id="resultBox" class="mt-6 hidden p-4 rounded-lg text-center transition-all">
            <h2 class="font-semibold text-lg mb-1">Kết quả nhận diện:</h2>
            <p id="fruitResult" class="text-2xl font-bold uppercase"></p>
            <p id="confidenceResult" class="text-sm mt-1"></p>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const uploadForm = document.getElementById('uploadForm');
        const resultBox = document.getElementById('resultBox');
        const fruitResult = document.getElementById('fruitResult');
        const confidenceResult = document.getElementById('confidenceResult');
        const submitBtn = document.getElementById('submitBtn');

        // Hiển thị ảnh xem trước khi người dùng chọn file
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImage.src = event.target.result;
                    previewContainer.classList.remove('hidden');
                    resultBox.classList.add('hidden'); // Giấu kết quả cũ đi
                }
                reader.readAsDataURL(file);
            }
        });

        // Xử lý gửi ảnh đi khi nhấn nút Phân Tích
        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const file = imageInput.files[0];
            if (!file) return;

            submitBtn.textContent = "⏳ Đang phân tích...";
            submitBtn.disabled = true;
            resultBox.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                resultBox.classList.remove('hidden');
                
                if(data.error) {
                    resultBox.className = "mt-6 p-4 rounded-lg text-center bg-red-50 text-red-700 border border-red-200";
                    fruitResult.textContent = "Lỗi xử lý";
                    confidenceResult.textContent = data.error;
                } else {
                    resultBox.className = "mt-6 p-4 rounded-lg text-center bg-green-50 text-green-700 border border-green-200";
                    fruitResult.textContent = data.prediction;
                    confidenceResult.textContent = "Độ tự tin: " + data.confidence;
                }
            } catch (error) {
                resultBox.classList.remove('hidden');
                resultBox.className = "mt-6 p-4 rounded-lg text-center bg-red-50 text-red-700 border border-red-200";
                fruitResult.textContent = "Mất kết nối";
                confidenceResult.textContent = "Không thể liên kết với server.";
            } finally {
                submitBtn.textContent = "🔍 Quét & Phân Tích";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
